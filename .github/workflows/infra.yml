name: Infraestructura

on:
  push:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  id-token: write   # necesario para OIDC (entrar a AWS sin claves)
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::478400396947:role/taller5-github-actions

jobs:
  validar:
    name: Validar y escanear
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Checkov (seguridad de la infraestructura)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Guardar evidencia de Checkov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-checkov
          path: checkov.sarif
          if-no-files-found: ignore

  aplicar:
    name: Aplicar en AWS
    needs: validar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Entrar a AWS con OIDC (sin claves)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -out=tfplan

      - name: terraform apply
        run: terraform apply -auto-approve tfplan
