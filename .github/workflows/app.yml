name: Aplicacion

on:
  push:
    branches: [main, master]
    paths: ["app/**", "Dockerfile", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::478400396947:role/taller5-github-actions
  ECR_REPOSITORY: taller5-app

jobs:
  construir-y-desplegar:
    name: Construir, analizar y desplegar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Entrar a AWS con OIDC (sin claves)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Entrar a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: docker build -t "$IMAGE" .

      - name: Trivy (vulnerabilidades de la imagen)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --format table --output trivy-report.txt "$IMAGE"
          cat trivy-report.txt

      - name: Guardar evidencia de Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-trivy
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Publicar imagen en ECR
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Desplegar en la maquina (via SSM)
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=taller5-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Maquina: $IID"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$IID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"/usr/local/bin/deploy.sh ${GITHUB_SHA}\"]" \
            --query "Command.CommandId" --output text)
          sleep 5
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$IID"
          echo "Version desplegada: ${GITHUB_SHA}"